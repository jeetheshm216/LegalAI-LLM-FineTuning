# configs/sft_legalai_32b.yaml
# LegalAI Multi-Task 32B SFT Training Configuration on NVIDIA B200 (Single GPU 2)
# Base Model: Qwen/Qwen2.5-32B-Instruct

model:
  model_name_or_path: "Qwen/Qwen2.5-32B-Instruct"
  trust_remote_code: true
  torch_dtype: "bfloat16"
  use_cache: false

data:
  train_file: "/data/user/sece2026-student07/data/multitask_32b_train.jsonl"
  validation_file: "/data/user/sece2026-student07/data/multitask_32b_val.jsonl"
  max_seq_length: 2048

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "/data/user/sece2026-student07/outputs/qwen32b-legalai-multitask-v1"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  lr_scheduler_type: "cosine"
  warmup_steps: 10
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 1
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 1
  eval_strategy: "steps"
  eval_steps: 50
  load_best_model_at_end: false
  seed: 42

hardware:
  bf16: true
  fp16: false
  gradient_checkpointing: true
  dataloader_num_workers: 2

logging:
  logging_steps: 1
  report_to: "none"
