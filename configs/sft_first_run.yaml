# configs/sft_first_run.yaml
# Single full-B200 first-run test configuration for LegalAI SFT
# Base Model: Qwen/Qwen2.5-14B-Instruct

model:
  model_name_or_path: "Qwen/Qwen2.5-14B-Instruct"
  trust_remote_code: false
  torch_dtype: "bfloat16"
  use_cache: false

data:
  train_file: "data/legal_train.jsonl"
  validation_file: "data/legal_validation.jsonl"
  max_seq_length: 2048

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "outputs/qwen14b-first-run-final-dataset"
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_steps: 5
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 1
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 1
  eval_strategy: "steps"
  eval_steps: 50
  load_best_model_at_end: false
  seed: 42

hardware:
  bf16: true
  fp16: false
  gradient_checkpointing: true
  dataloader_num_workers: 2

logging:
  logging_steps: 1
  report_to: "none"
